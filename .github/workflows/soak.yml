name: Nightly soak

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC nightly
  workflow_dispatch:
    inputs:
      seeds:
        description: "Number of seeds"
        default: "2000"

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Long-haul simulation soak (clients + nemesis + porcupine)
        env:
          QUORUM_SOAK: "1"
          QUORUM_SOAK_SEEDS: ${{ github.event.inputs.seeds || '2000' }}
        run: go test ./sim -run TestSoakNightly -count=1 -timeout 150m -v
