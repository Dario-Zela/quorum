name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Dependency rule (raft imports stdlib only; sim never imports grpc/wal)
        run: |
          if [ -d raft ]; then
            bad=$(go list -deps ./raft | grep -v '^github.com/Dario-Zela/quorum' | grep '\.' || true)
            if [ -n "$bad" ]; then echo "raft/ has non-stdlib deps:"; echo "$bad"; exit 1; fi
          fi
          if [ -d sim ]; then
            if go list -deps ./sim | grep -qE 'transport/grpctransport|storage/wal'; then
              echo "sim/ imports a production-only package"; exit 1
            fi
          fi
      - name: Unit + short sim tests
        run: go test ./... -count=1 -timeout 15m
