// WAL record payloads. The wire format around them is
// [len:u32][crc32c:u32][payload]; see storage/wal.
syntax = "proto3";

package quorumpb;

option go_package = "github.com/Dario-Zela/quorum/proto/quorumpb";

message Entry {
  uint64 term  = 1;
  uint64 index = 2;
  bytes  data  = 3;
}

// WalRecord is one framed record in a WAL segment.
message WalRecord {
  oneof rec {
    HardStateRec hard_state = 1;
    EntriesRec   entries    = 2;
    TruncateRec  truncate   = 3;
  }
}

message HardStateRec {
  uint64 term      = 1;
  uint64 voted_for = 2;
}

message EntriesRec {
  repeated Entry entries = 1;
}

// TruncateRec logs the discard of entries at index >= from_index. An
// append-only file cannot physically delete a conflicting suffix, so
// truncation is itself a logged event that recovery replays — without it a
// restart resurrects entries the node already disowned to its leader.
message TruncateRec {
  uint64 from_index = 1;
}

// SnapshotFile is the on-disk snapshot (snap-<index>-<term>.db), framed
// [len:u32][crc32c:u32][payload] like WAL records.
message SnapshotFile {
  uint64 last_included_index = 1;
  uint64 last_included_term  = 2;
  bytes  kv                  = 3; // marshaled KVSnapshot
}
